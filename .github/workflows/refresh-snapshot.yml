name: Refresh portfolio snapshot

# Manual snapshot refresh (commit-only). Re-runs the gh-api scrape and commits
# the updated src/data/repos.json so the repo records the snapshot.
#
# workflow_dispatch-ONLY by design (mirrors apex deploy.yml): a cron committing
# a generated file to main is an out-of-band writer that collides with open PRs,
# so the timer is removed and this is a manual button instead. Deploy is the
# escape-hatch's job now (scripts/deploy.sh, npm run deploy) -- the old
# in-workflow FTP deploy was 530-broken (bad creds) and is gone.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: refresh src/data/repos.json (manual, commit-only)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Run refresh script
        env:
          # gh CLI uses GITHUB_TOKEN automatically.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-snapshot.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/repos.json; then
            echo "no snapshot changes"
          else
            git add src/data/repos.json
            git commit -m "chore(snapshot): refresh from gh api"
            git push
          fi
